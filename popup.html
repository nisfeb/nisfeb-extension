<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nisfeb</title>
  <style>
    :root { color-scheme: light dark; --amber: #f9a804; --navy: #101541; }
    body { font: 13px/1.45 system-ui, sans-serif; width: 380px; margin: 0; padding: .75rem; }
    header { display: flex; align-items: center; gap: .5rem; margin-bottom: .4rem; }
    .dot { width: .55rem; height: .55rem; border-radius: 50%; background: #999; flex: none; }
    .ok { background: #2e9e4f; } .bad { background: #c0392b; } .warn { background: var(--amber); }
    #who { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #page { opacity: .7; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 0 .4rem; }
    details { border-top: 1px solid #8884; padding: .4rem 0; }
    summary { cursor: pointer; font-weight: 600; }
    summary small { font-weight: 400; opacity: .7; }
    label { display: block; margin: .4rem 0 .15rem; opacity: .75; font-size: 12px; }
    input, textarea, select { width: 100%; box-sizing: border-box; font: inherit; padding: .3rem; }
    textarea { min-height: 4.5rem; resize: vertical; }
    .row { display: flex; gap: .5rem; } .row > * { flex: 1; min-width: 0; }
    button { font: inherit; padding: .35rem .7rem; margin-top: .5rem; }
    button.primary { background: var(--amber); color: var(--navy); border: 0; font-weight: 600; }
    .out { margin: .4rem 0 0; font-size: 12px; min-height: 1em; word-break: break-word; }
    .out.bad { color: #c0392b; }
    #answer { white-space: pre-wrap; max-height: 14rem; overflow: auto; margin: .4rem 0 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span><span id="who">…</span>
    <button id="today">Today</button>
    <button id="opts">Options</button>
  </header>
  <p id="page"></p>

  <details id="mail">
    <summary>Send to Auspex</summary>
    <label for="to">To (ships, separated by spaces or commas)</label>
    <input id="to" placeholder="~sampel-palnet ~zod" autocomplete="off">
    <label for="subject">Subject</label>
    <input id="subject">
    <label for="body">Body</label>
    <textarea id="body"></textarea>
    <button class="primary" data-do="mail">Send</button>
    <button data-do="draft">Edit in Auspex</button>
    <p class="out"></p>
  </details>

  <details id="chat">
    <summary>Send to a chat</summary>
    <label for="cwhom">Chat (a DM, a group DM or a group's chat channel; or type a ship)</label>
    <input id="cwhom" list="chatlist" placeholder="~sampel-palnet or a channel's name" autocomplete="off">
    <datalist id="chatlist"></datalist>
    <label for="ctext">Message</label>
    <textarea id="ctext"></textarea>
    <button class="primary" data-do="chat">Send</button>
    <p class="out"></p>
  </details>

  <details id="read">
    <summary>Read in Orrery</summary>
    <label for="rtitle">Title</label>
    <input id="rtitle">
    <label for="rtext">Text (the selection; leave it empty to send the page's readable text)</label>
    <textarea id="rtext" placeholder="Nothing selected: the page's own text goes."></textarea>
    <button class="primary" data-do="read">Send to Orrery</button>
    <p class="out"></p>
  </details>

  <details id="lattice">
    <summary>Keep in Lattice</summary>
    <button class="primary" data-do="clip">Save selection as a page</button>
    <button data-do="bookmark">Bookmark</button>
    <button data-do="archive">Archive the page</button>
    <p class="out"></p>
  </details>

  <details id="event">
    <summary>Add to Calendar</summary>
    <div class="row">
      <div><label for="ekind">Kind</label>
        <select id="ekind"><option value="event">Event</option><option value="task">Task</option></select></div>
      <div><label for="edate">Date</label><input id="edate" type="date"></div>
      <div><label for="etime">Time</label><input id="etime" type="time"></div>
      <div><label for="emin">Minutes</label><input id="emin" type="number" min="1" value="60"></div>
    </div>
    <label for="ename">Name</label>
    <input id="ename">
    <label for="enote">Note</label>
    <textarea id="enote"></textarea>
    <button class="primary" data-do="event">Add</button>
    <p class="out"></p>
  </details>

  <details id="ask">
    <summary>Ask Armillary <small id="balance"></small></summary>
    <div id="askform" class="hidden">
      <label for="prompt">Question, about the selection or the whole page</label>
      <textarea id="prompt">Summarize this in five lines.</textarea>
      <label for="model">Model</label>
      <div class="row">
        <select id="model"></select>
        <button class="primary" data-do="ask">Ask</button>
      </div>
    </div>
    <p class="out"></p>
    <button id="armillary" class="hidden">Open Armillary</button>
    <p id="answer"></p>
    <button id="keep" class="hidden" data-do="keep">Save the answer to Lattice</button>
  </details>

  <script src="popup.js" type="module"></script>
</body>
</html>
