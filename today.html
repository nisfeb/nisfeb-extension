<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today</title>
  <script src="boot.js"></script>
  <style>
    /* Talon's built-in palette (Theme.kt), light or dark as the system is.
       A custom Talon theme, a mode chosen in Options, an accent or Talon's
       font sets these inline on <html>. */
    :root { color-scheme: light; --bg: #ffffff; --text: #1c1917; --muted: #57534e; --raised: #f5f5f4; --outline: #a8a29e; --line: #e7e5e4; --accent: #f59e0b; --on-accent: #1c1917; --error: #dc2626; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #1a1625; --text: #f5f5f4; --muted: #a8a29e; --raised: #27232f; --outline: #44403c; --line: #292524; --accent: #fbbf24; --error: #f87171; } }

    /* Talon's home page (HomeScreen.kt): its typography (Typography.kt,
       Material's sizes in the system's sans unless Talon has a font),
       16px of page margin, 14px between widgets, each widget a Panel:
       surfaceVariant at 30% on the surface, 10px corners, no border, a
       16px icon and a 14px semibold title over a faint divider. */
    body { font: 14px/20px var(--font, sans-serif); margin: 0; padding: 16px; background-color: var(--bg); color: var(--text);
           background-position: center; background-size: cover; background-attachment: fixed; background-repeat: no-repeat; }
    header, main { max-width: 72rem; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    h1 { font-size: 24px; line-height: 32px; font-weight: 600; margin: 0; }
    #who { color: var(--muted); font-size: 12px; line-height: 16px; display: flex; align-items: center; gap: 6px; }
    .grow { flex: 1; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--outline); flex: none; }
    .dot.ok { background: #2e9e4f; } .dot.bad { background: var(--error); } .dot.warn { background: var(--accent); }
    /* Talon's grid (lib/layout.js): twelve columns, rows of 26px with the
       14px gap under each (a unit of 40), each card on its squares */
    main { display: grid; gap: 14px; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: 26px; align-items: stretch; }
    [data-card] { grid-column: var(--gc, auto / span 4); grid-row: var(--gr, auto / span 6); }
    #none { grid-column: 6 / span 7; grid-row: 1 / span 3; }
    .panel { background: color-mix(in srgb, var(--raised) 30%, var(--bg)); border-radius: 10px; padding: 10px 0; min-width: 0; min-height: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; }
    .panel > .body, .panel > .talk { flex: 1; min-height: 0; overflow: auto; }
    /* a narrow window: full width, in reading order, each its own height */
    @media (max-width: 760px) {
      main { grid-template-columns: minmax(0, 1fr); }
      [data-card], #none { grid-column: 1 / -1; grid-row: auto / span var(--h, 6); order: var(--o, 0); }
      .grip, body.arranging .move { display: none !important; }
    }
    .panel > h2 { display: flex; align-items: center; gap: 8px; margin: 0 6px 4px 14px; font-size: 14px; line-height: 18px; font-weight: 600; letter-spacing: .1px; min-height: 32px; }
    .panel > h2 svg { width: 16px; height: 16px; fill: var(--muted); flex: none; }
    .panel > h2 span { flex: 1; }
    .panel > h2 a { color: var(--accent); text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 500; padding: 6px 8px; border-radius: 16px; }
    .panel > h2 a:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .panel > hr { border: 0; border-top: 1px solid color-mix(in srgb, var(--line) 50%, transparent); margin: 0 14px; }
    .body { padding-top: 2px; }
    ul { list-style: none; margin: 0; padding: 0; }
    /* QuickRow: a 12px line, 11px muted beside and under it */
    li { padding: 6px 14px; overflow-wrap: anywhere; }
    li .row { display: flex; gap: 8px; align-items: baseline; }
    li .title { flex: 1; font-size: 12px; line-height: 16px; min-width: 0; }
    li .title.strong { font-weight: 600; }
    li .side, li .line { font-size: 11px; line-height: 14px; color: var(--muted); }
    li.past { opacity: .5; }
    li a { color: inherit; text-decoration: none; }
    li a:hover { text-decoration: underline; }
    .body > p, .body > h3 { margin: 0; padding: 10px 14px; font-size: 12px; line-height: 16px; }
    .body > h3 { padding: 8px 14px 0; color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); }
    .bad { color: var(--error); }
    .body > p.big { font-size: 24px; line-height: 32px; padding: 6px 14px 0; }
    button { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--outline); border-radius: 16px; padding: 6px 14px; cursor: pointer; }
    button.text { background: none; border: 0; color: var(--accent); font-weight: 500; }

    /* the sky clock, as Talon's ClockWeatherPanel: the panel's tint, no header */
    .clock { padding: 6px 0; align-items: center; justify-content: center; container-type: size; }
    /* the dial takes what its card gives it, square, and room for the place line */
    .dial { position: relative; width: min(100cqw - 24px, 100cqh - 44px); aspect-ratio: 1; flex: none; }
    .dial canvas { width: 100%; height: 100%; display: block; }
    .readout { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--muted); pointer-events: none; line-height: 1.3; }
    .readout .time { color: var(--text); font-weight: 500; white-space: nowrap; }
    .readout .date { font-size: 14px; }
    .readout .cond { display: flex; align-items: center; gap: 4px; font-size: 12px; margin-top: 2px; }
    .readout .cond svg { width: 14px; height: 14px; fill: currentColor; }
    .readout .temp { color: var(--text); font-size: 24px; margin-top: 6px; }
    .readout .hilo { display: flex; gap: 10px; font-size: 12px; }
    .readout .hilo .at { font-size: 11px; }
    .clock button.where { background: none; border: 0; color: var(--accent); font-size: 11px; line-height: 14px; padding: 2px 12px; }
    .clock p { font-size: 11px; line-height: 14px; color: var(--muted); margin: 0 24px; text-align: center; }

    /* over a picture of the owner's, the panels stay legible */
    body.pictured .panel, body.pictured header { background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(8px); }
    body.pictured header { border-radius: 10px; padding: 8px 14px; }

    /* arranging, as Talon's: a long press or a right-click on any card
       starts it, cards are dragged to their places, Done ends it */
    body.arranging .panel { outline: 1px solid var(--line); cursor: grab; user-select: none; }
    body.arranging .panel.clash { outline: 2px solid var(--error); }
    /* the corner that resizes, on hover and while arranging */
    .grip { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; opacity: 0; z-index: 2;
            background: linear-gradient(135deg, transparent 50%, var(--outline) 50%, var(--outline) 60%, transparent 60%, transparent 70%, var(--outline) 70%, var(--outline) 80%, transparent 80%); }
    .panel:hover .grip, body.arranging .grip, body.dragging .held .grip { opacity: 1; }
    body.dragging { user-select: none; cursor: grabbing; }
    .panel.gone { display: none; }
    .addcards { display: flex; gap: 6px; flex-wrap: wrap; }
    .addcards button { padding: 4px 10px; font-size: 12px; }
    .move button.remove { color: var(--error); }
    .panel.held { z-index: 5; outline: 1px solid var(--accent); box-shadow: 0 8px 24px rgb(0 0 0 / .25); transition: none; }
    .move { display: none; position: absolute; top: 8px; right: 8px; gap: 4px; z-index: 1; }
    body.arranging .move { display: flex; }
    .move button { padding: 2px 8px; font-size: 12px; }
    /* the assistant: Talon's, as a card; the owner's words on the right */
    .talk { padding: 4px 14px; display: flex; flex-direction: column; gap: 8px; }
    .talk .me { align-self: flex-end; background: color-mix(in srgb, var(--accent) 18%, transparent); border-radius: 12px 12px 2px 12px; padding: 6px 10px; max-width: 85%; white-space: pre-wrap; font-size: 13px; }
    .talk .it { white-space: pre-wrap; font-size: 13px; line-height: 19px; }
    .talk .note { color: var(--muted); font-size: 12px; }
    .confirm { margin: 4px 14px; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 8px; font-size: 13px; }
    .confirm div { display: flex; gap: 8px; margin-top: 6px; }
    button.primary { background: var(--accent); color: var(--on-accent); border: 0; font-weight: 500; }
    /* the bar: Brave Search, or the assistant */
    .searchbar { max-width: 72rem; margin: 0 auto 14px; display: flex; gap: 8px; }
    .searchbar input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text); background: color-mix(in srgb, var(--raised) 30%, var(--bg)); border: 1px solid var(--line); border-radius: 22px; padding: 10px 18px; }
    .searchbar input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    body.pictured .searchbar input { background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(8px); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1 id="hello"></h1>
    <span id="who"><span class="dot" id="dot"></span><span id="whotext"></span></span>
    <span class="grow"></span>
    <span id="addcards" class="addcards" hidden></span>
    <button class="text" id="done" hidden>Done</button>
    <button class="text" id="opts">Options</button>
  </header>

  <form class="searchbar" id="searchform" role="search" autocomplete="off">
    <input id="sq" type="search" autofocus placeholder="Search with Brave, or Shift+Enter to ask your assistant" aria-label="Search with Brave, or ask your assistant">
    <button class="primary" title="Search with Brave (Enter)">Search</button>
    <button type="button" id="toassist" title="Ask your assistant, which knows your calendar and orrery (Shift+Enter)">Assistant</button>
  </form>

  <main id="grid">
    <section class="panel" id="none" hidden>
      <div class="body"><p>No ship yet. Set one up in Options and this page shows your day from it.</p></div>
    </section>
    <section class="panel clock" id="clock" data-card="clock">
      <div class="dial"><canvas id="dial" role="img"></canvas><div class="readout" id="readout"></div></div>
      <button class="where" id="where">Set a location</button>
      <p id="nowhere">Without one the dial shows an even day and no weather.</p>
    </section>
    <section class="panel" id="assistant" data-card="assistant">
      <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg><span>Assistant</span><button class="text" id="anew">New</button></h2>
      <hr>
      <div class="talk" id="talk" aria-live="polite"></div>
      <div class="confirm" id="confirm" hidden><span id="ctext"></span><div><button class="primary" id="cyes">Do it</button><button id="cno">Don't</button></div></div>
    </section>
    <section class="panel" id="cal" data-card="cal">
      <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/></svg><span>Today</span><a data-app="/apps/calendar/">Calendar</a></h2>
      <hr><div class="body"></div>
    </section>
    <section class="panel" id="actions" data-card="actions">
      <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg><span>Orrery</span><a data-app="/apps/orrery/#inbox">Inbox</a></h2>
      <hr><div class="body"></div>
    </section>
    <section class="panel" id="mail" data-card="mail">
      <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8l8 5 8-5v10zm-8-7L4 6h16l-8 5z"/></svg><span>Mail</span><a data-app="/apps/auspex/">Inbox</a></h2>
      <hr><div class="body"></div>
    </section>
    <section class="panel" id="money" data-card="money">
      <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg><span>Armillary</span><a data-app="/apps/armillary/">Open</a></h2>
      <hr><div class="body"></div>
    </section>
  </main>
  <script src="today.js" type="module"></script>
</body>
</html>
